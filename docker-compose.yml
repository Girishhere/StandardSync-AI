version: "3.9"

services:
  backend:
    build: ./backend
    container_name: standardsync-backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=${DEMO_MODE:-true}
      - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD:-0.60}
      - FAISS_TOP_K=${FAISS_TOP_K:-5}
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=standardsync
      - ALLOWED_ORIGINS=http://localhost:3000
    depends_on:
      - mongo
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: standardsync-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: standardsync-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
